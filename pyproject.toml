[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "og-canvas-forge"
version = "0.1.0"
description = "Pure Python zero-dependency OpenGraph social card canvas forge with QR Matrix Synthesizer, Watermark & Branding Engine, WCAG 2.2 Contrast Auditor, Schema.org JSON-LD, Studio UI, and MCP Server."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "OG Canvas Forge Team" }
]
keywords = [
    "opengraph",
    "social-cards",
    "svg",
    "preview-generator",
    "twitter-cards",
    "mcp-server",
    "canvas-forge",
    "qr-code",
    "barcode",
    "watermark",
    "branding",
    "wcag-accessibility",
    "contrast-checker",
    "schema-org",
    "json-ld",
    "material-design-3",
    "pure-python",
    "zero-dependency"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
og-canvas-forge = "og_canvas_forge.cli:main"
og-canvas = "og_canvas_forge.cli:main"
og-forge = "og_canvas_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
